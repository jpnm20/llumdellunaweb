<!-- header.html -->
<header class="header" id="header">
    <div class="container">
        <a href="index.html" class="logo">
            <img src="images/logo texto verde.png" alt="Llum de Lluna - Estética y Bienestar" class="logo-img">
        </a>
        
        <nav class="nav">
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link" data-i18n="nav.home">Inicio</a></li>
                <li><a href="tratamientos.html" class="nav-link" data-i18n="nav.treatments">Tratamientos</a></li>
                <li><a href="galeria.html" class="nav-link" data-i18n="nav.gallery">Galería</a></li>
                <li><a href="index.html#contacto" class="nav-link btn btn-outline" data-i18n="nav.appointment">Cita</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <!-- Selector de Idioma (ES / VA / EN) -->
            <div class="lang-dropdown-wrapper">
                <button id="langToggleBtn" class="lang-toggle-btn" aria-label="Cambiar idioma / Select language" aria-expanded="false" title="Cambiar idioma">
                    <svg class="globe-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                    </svg>
                    <span id="currentLangLabel" class="lang-label">ES</span>
                    <svg class="chevron-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div id="langDropdownMenu" class="lang-dropdown-menu" role="menu">
                    <button class="lang-option-btn active" data-lang="es" role="menuitem">
                        <span class="flag-icon">🇪🇸</span> Castellano
                    </button>
                    <button class="lang-option-btn" data-lang="va" role="menuitem">
                        <span class="flag-icon">
                            <svg viewBox="0 0 640 480" width="18" height="13" style="border-radius: 2px; vertical-align: middle; box-shadow: 0 0 1px rgba(0,0,0,0.4);">
                                <rect width="640" height="480" fill="#FBCD07"/>
                                <rect y="53.33" width="640" height="53.33" fill="#D7141A"/>
                                <rect y="160" width="640" height="53.33" fill="#D7141A"/>
                                <rect y="266.67" width="640" height="53.33" fill="#D7141A"/>
                                <rect y="373.33" width="640" height="53.33" fill="#D7141A"/>
                                <rect width="160" height="480" fill="#002B7F"/>
                            </svg>
                        </span> Valencià
                    </button>
                    <button class="lang-option-btn" data-lang="en" role="menuitem">
                        <span class="flag-icon">🇬🇧</span> English
                    </button>
                </div>
            </div>

            <!-- Botón Dark Mode / Light Mode (Estrella / Luna) -->
            <button id="themeToggle" class="theme-toggle-btn" aria-label="Cambiar modo oscuro / claro" title="Cambiar tema">
                <!-- Icono Estrella (Modo Claro) -->
                <svg class="star-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                <!-- Icono Luna (Modo Oscuro) -->
                <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <span class="theme-toggle-label" id="themeToggleText" data-i18n="header.mode">Modo</span>
            </button>

            <!-- Botón Hamburguesa Móvil (3 líneas) -->
            <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú de navegación">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>
</header>
